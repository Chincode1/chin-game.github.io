<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้านเครดิต</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fff;--tx:#111;--mu:#8a8a8a;--bd:#ececec;--ac:#111;--ac2:#fff;--ok:#16a34a;--er:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--tx:#f1f1f1;--mu:#8c8c8c;--bd:#242424;--ac:#f1f1f1;--ac2:#0e0e0e}}
:root[data-theme="dark"]{--bg:#0e0e0e;--tx:#f1f1f1;--mu:#8c8c8c;--bd:#242424;--ac:#f1f1f1;--ac2:#0e0e0e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,sans-serif;font-size:15px;font-weight:400;line-height:1.6}
a{color:var(--tx)}.w{max-width:880px;margin:0 auto;padding:0 20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 0;margin-bottom:28px;border-bottom:1px solid var(--bd)}
.lg{font-weight:500;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.lg img{height:28px;max-width:110px;object-fit:contain}.hr{display:flex;align-items:center;gap:8px}
.cr{font-size:13px;color:var(--mu);margin-right:4px;white-space:nowrap}
.ib{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit;font-size:13px}
nav{display:flex;gap:22px;margin-bottom:28px;border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{background:none;border:0;border-bottom:1.5px solid transparent;padding:0 0 12px;color:var(--mu);font:inherit;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
nav button.on{color:var(--tx);border-color:var(--tx)}
.c{border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px}.c h3{margin:0 0 4px;font-size:15px;font-weight:500}
.mu{color:var(--mu);font-size:14px}.r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px 16px}
.p{cursor:pointer}.p .im{aspect-ratio:1;background:var(--bd);border-radius:10px;overflow:hidden}
.p img,.big{width:100%;height:100%;object-fit:cover;display:block}.p img{transition:opacity .2s}.p:hover img{opacity:.88}
.p .t{padding:10px 2px 0}.p b{display:block;font-weight:500;font-size:14px}
input,textarea{width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;margin:4px 0 10px;outline:0;border-radius:0}
input:focus,textarea:focus{border-color:var(--tx)}input[type=file]{font-size:13px;color:var(--mu);border:0}
.b{padding:11px 22px;border:1px solid var(--ac);border-radius:8px;background:var(--ac);color:var(--ac2);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.b.s{background:transparent;color:var(--tx);border-color:var(--bd)}.b.d{background:var(--er);border-color:var(--er);color:#fff}.b.sm{padding:7px 14px;font-size:13px}.b:disabled{opacity:.4}
.msg{margin-top:10px;padding:12px;border-radius:8px;background:var(--bd);white-space:pre-wrap;word-break:break-word;font-size:14px}
#t{display:none}
#tw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(92vw,380px);display:flex;flex-direction:column;gap:8px;z-index:20;pointer-events:none}
.ts{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.14);font-size:14px;cursor:pointer;animation:tin .35s cubic-bezier(.2,.9,.3,1.2)}
.ts.out{animation:tout .25s forwards}
.ts i{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;color:#fff;background:var(--ok)}
.ts.er i{background:var(--er)}
.ts u{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ok);transform-origin:left;animation:tbar 3.4s linear forwards}
.ts.er u{background:var(--er)}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes tbar{to{transform:scaleX(0)}}.ok{color:var(--ok)}.er{color:var(--er)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:14px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.md .bd{padding:20px}.md .big{aspect-ratio:1;height:auto}
.au{max-width:340px;margin:40px auto}.au h2{font-weight:500;font-size:22px;margin:0 0 20px}

.cl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--bd)}
.cl input[type=color]{width:44px;height:30px;padding:0;margin:0;border:1px solid var(--bd);border-radius:6px;background:none;cursor:pointer}
.cl input[type=range]{width:130px;margin:0;padding:0;border:0;accent-color:var(--ac)}
.rv{display:flex;align-items:center;gap:8px}.rv b{font-weight:400;font-size:13px;min-width:30px;text-align:right;color:var(--mu)}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;font:inherit;font-size:13px;max-width:55%}
.sp{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}.sp.hide{opacity:0;visibility:hidden}
.si{text-align:center;padding:20px}.sp.zoom .si{animation:szoom .9s cubic-bezier(.2,.9,.3,1) both}.sp.slide .si{animation:sslide .9s ease both}.sp.fade .si{animation:sfade 1.1s ease both}
.si img{max-height:90px;max-width:220px;object-fit:contain}.si .nm{font-size:28px;font-weight:500;letter-spacing:.08em}.si .tg{margin-top:10px;opacity:.6;font-size:14px;letter-spacing:.12em}
.sb{width:120px;height:2px;margin:28px auto 0;overflow:hidden;border-radius:2px;background:color-mix(in srgb,currentColor 15%,transparent)}
.sb u{display:block;height:100%;width:100%;background:currentColor;transform-origin:left;animation:sload linear both}
@keyframes szoom{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes sslide{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes sfade{from{opacity:0}to{opacity:1}}
@keyframes sload{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap;display:inline-block}.chip.approved{color:var(--ok);border-color:var(--ok)}.chip.rejected{color:var(--er);border-color:var(--er)}.chip.pending{color:var(--mu)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--bd)}.rw:last-child{border:0}.ac{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body><div class="sp" id="sp0"></div><div class="w"><div id="app" class="mu">กำลังโหลด...</div></div><div id="mo"></div>
<script>
/* ===== วาง firebaseConfig ของคุณตรงนี้ (จาก Firebase Console > Project settings > Your apps) ===== */
const CFG={
  apiKey:"",
  authDomain:"",
  projectId:"",
  storageBucket:"",
  messagingSenderId:"",
  appId:""
};
/* ================================================================================================ */

const $=s=>document.querySelector(s);
const esc=s=>String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastMsg="",db,me=null,showAuth=false,pend=null,credits=0,orders=[],products=[],site={},tab="shop",note="",authMode="in",ro=false;
let myTop=[],allTop=[],accts=[],wals=[],logs=[],asub="topups";

const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const say=(m,ok)=>{let w=$("#tw");if(!w){w=document.createElement("div");w.id="tw";document.body.appendChild(w)}
  while(w.children.length>=3)w.firstChild.remove();
  const t=document.createElement("div");t.className="ts"+(ok?"":" er");t.innerHTML=`<i>${ok?"✓":"!"}</i><span>${esc(m)}</span><u></u>`;
  const x=()=>{t.classList.add("out");setTimeout(()=>t.remove(),250)};t.onclick=x;w.appendChild(t);setTimeout(x,3400)};
const H=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const wref=()=>db.doc("wallets/"+me.u);
const ERR=e=>e&&(e.code=="invalid_argument"?"บัญชีนี้ดูข้อมูลได้อย่างเดียว บันทึกไม่ได้ กรุณาขอสิทธิ์ Contributor จากเจ้าของเว็บ":e.code=="permission-denied"?"ไม่มีสิทธิ์เขียนฐานข้อมูล ตรวจ Firestore Rules":(e.message||e.code||e.name||e.type))||"ผิดพลาด";
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark";LS.set("th",r.dataset.theme)}
if(LS.get("th"))document.documentElement.dataset.theme=LS.get("th");
function pic(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no(new Error("อ่านไฟล์รูปไม่ได้"));fr.onload=()=>{const i=new Image();i.onload=()=>{try{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(/png$/.test(file.type)&&max<300?"image/png":"image/jpeg",.75))}catch(e){no(e)}};i.onerror=()=>no(new Error("เปิดรูปนี้ไม่ได้ ลองใช้ไฟล์ JPG/PNG"));i.src=fr.result};fr.readAsDataURL(file)})}
function ask(msg){return new Promise(r=>{$("#mo").innerHTML=`<div class="ov"><div class="md"><div class="bd"><p>${esc(msg)}</p><div class="r"><button class="b s" id="n">ยกเลิก</button><button class="b d" id="y">ยืนยัน</button></div></div></div></div>`;$("#y").onclick=()=>{$("#mo").innerHTML="";r(1)};$("#n").onclick=()=>{$("#mo").innerHTML="";r(0)}})}

async function load(){
  try {
    const [s,w,p]=await Promise.all([db.doc("settings/site").get(),me?wref().get():Promise.resolve({exists:false}),db.collection("products").get()]);
    site=s.exists?s.data():{};applyTheme(site);const d=w.exists?w.data():{};credits=d.credits||0;orders=d.orders||[];
    products=p.docs.map(x=>({id:x.id,...x.data()}));
    if(me){const g=async q=>(await q.get()).docs.map(x=>({id:x.id,...x.data()}));
      myTop=(await g(db.collection("topups").where("u","==",me.u))).sort((a,b)=>b.at-a.at);
      if(me.role=="admin"){[allTop,accts,wals,logs]=await Promise.all([g(db.collection("topups")),g(db.collection("accounts")),g(db.collection("wallets")),g(db.collection("logins").orderBy("at","desc").limit(500))]);allTop.sort((a,b)=>b.at-a.at)}
    }
  } catch(err) {
    console.error("Load error:", err);
  }
}

/* ---- อัปเดตสดให้ทุกคนที่เปิดเว็บอยู่ ---- */
let unW=null;
const same=(a,b)=>{try{return JSON.stringify(a)==JSON.stringify(b)}catch(e){return false}};
const idle=()=>{const a=document.activeElement;return tab=="shop"&&!showAuth&&!$("#mo").innerHTML&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
function live(){
  try{
    db.doc("settings/site").onSnapshot(s=>{try{const d=s.exists?s.data():{};if(same(d,site))return;site=d;applyTheme(site);if(idle())render()}catch(e){}},()=>{});
    db.collection("products").onSnapshot(q=>{try{const l=q.docs.map(x=>({id:x.id,...x.data()}));if(same(l,products))return;products=l;if(idle())render()}catch(e){}},()=>{});
  }catch(e){}
}
function liveWallet(){
  if(unW){try{unW()}catch(e){}unW=null}
  if(!me)return;
  try{unW=wref().onSnapshot(s=>{try{const d=s.exists?s.data():{},c=d.credits||0;if(c!==credits){credits=c;const e=$(".cr");if(e)e.textContent=c+" เครดิต"}}catch(e){}},()=>{})}catch(e){}
}

const roBar=()=>ro?`<div class="c mu">บัญชีนี้ดูข้อมูลได้อย่างเดียว สมัคร/ซื้อ/เติมเงินไม่ได้ กรุณาขอสิทธิ์ Contributor จากเจ้าของเว็บ</div>`:"";
function head(){return `<header><div class="lg" onclick="home()">${site.logo?`<img src="${site.logo}">`:""}<span>${esc(site.name||"ร้านเครดิต")}</span></div><div class="hr">${me?`<span class="cr">${credits} เครดิต</span>`:""}<button class="ib" onclick="theme()" aria-label="ธีม">◐</button>${me?`<button class="ib" onclick="logout()">ออก</button>`:`<button class="b sm" onclick="goAuth('in')">เข้าสู่ระบบ</button>`}</div></header>`+roBar()}
const home=()=>{showAuth=false;pend=null;tab="shop";render()};
const goAuth=m=>{authMode=m;showAuth=true;note="";render()};
function render(){applyTheme(site);
  if(!me&&showAuth){const i=authMode=='in';$("#app").innerHTML=head()+`<div class="au"><h2>${i?'เข้าสู่ระบบ':'สมัครสมาชิก'}</h2>${pend?'<p class="mu">กรุณาเข้าสู่ระบบหรือสมัครสมาชิกก่อนสั่งซื้อ</p>':''}<input id="u" placeholder="ชื่อผู้ใช้" autocapitalize="none"><input id="pw" type="password" placeholder="รหัสผ่าน"><div id="t">${note}</div><button class="b" style="width:100%" onclick="auth()">${i?'เข้าสู่ระบบ':'สมัครสมาชิก'}</button><p class="mu" style="text-align:center;margin-top:18px">${i?'ยังไม่มีบัญชี? <a href="#" onclick="goAuth(\'up\');return false">สมัครสมาชิก</a>':'มีบัญชีแล้ว? <a href="#" onclick="goAuth(\'in\');return false">เข้าสู่ระบบ</a>'}</p><p style="text-align:center"><a class="mu" href="#" onclick="home();return false">← กลับหน้าร้าน</a></p></div>`;return}
  const tabs=me?[["shop","ร้านค้า"],["key","เติมเครดิต"]]:[];if(me&&me.role=="admin")tabs.push(["admin","แอดมิน"+(allTop.some(t=>t.status=="pending")?" ●":"")]);
  let h=head()+(tabs.length?`<nav>${tabs.map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join("")}</nav>`:"")+`<div id="t">${note}</div>`;
  if(tab=="shop")h+=products.length?`<div class="g">${products.map(p=>`<div class="p" onclick="detail('${p.id}')"><div class="im">${p.img?`<img src="${p.img}">`:""}</div><div class="t"><b>${esc(p.name)}</b><span class="mu">${p.price} เครดิต</span></div></div>`).join("")}</div>`:`<div class="c mu">ยังไม่มีสินค้า</div>`;
  if(tab=="key"){const ig=site.ig?`<a class="b s" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(site.ig.replace(/^@/,''))}">Instagram</a>`:"",ln=site.line?`<a class="b s" target="_blank" rel="noopener" href="https://line.me/ti/p/~${encodeURIComponent(site.line.replace(/^@/,''))}">LINE</a>`:"";
    h+=topupUI()+`<div class="c"><h3>ใส่คีย์เพื่อรับเครดิต</h3><div class="mu">1 คีย์ใช้ได้ 1 ครั้ง</div><input id="k" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters"><button class="b" onclick="redeem()">ยืนยันคีย์</button></div>
    <div class="c"><h3>ซื้อคีย์เครดิตกับแอดมิน</h3><div class="mu" style="margin-bottom:8px">ติดต่อแอดมินเพื่อซื้อคีย์เครดิต</div>${ig||ln?ig+" "+ln:`<span class="mu">แอดมินยังไม่ได้ตั้งช่องทางติดต่อ</span>`}</div>`}
  if(tab=="admin")h+=adminHTML();
  $("#app").innerHTML=h;
}
function detail(id){const p=products.find(x=>x.id==id);if(!p)return;
  $("#mo").innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">${p.img?`<img class="big" src="${p.img}">`:""}<div class="bd"><h3>${esc(p.name)}</h3><p class="mu" style="white-space:pre-wrap">${esc(p.desc)}</p><div class="r"><b>${p.price} เครดิต</b><span><button class="b s" onclick="closeM()">ปิด</button> <button class="b" id="bb" onclick="buy('${p.id}')">สั่งซื้อ</button></span></div></div></div></div>`}
async function copyMsg(){
  const b=$("#cp");let ok=false;
  try{await navigator.clipboard.writeText(lastMsg);ok=true}catch(e){
    try{const t=document.createElement("textarea");t.value=lastMsg;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(e2){}}
  if(b)b.textContent=ok?"คัดลอกแล้ว ✓":"คัดลอกไม่ได้ กรุณาเลือกข้อความเอง";say(ok?"คัดลอกข้อความแล้ว":"คัดลอกไม่ได้ กรุณาเลือกข้อความเอง",ok);
}
const closeM=()=>$("#mo").innerHTML="";
async function auth(){
  const u=$("#u").value.trim().toLowerCase(),pw=$("#pw").value;
  if(!/^[a-z0-9_]{3,20}$/.test(u))return say("ชื่อผู้ใช้ 3-20 ตัว (a-z 0-9 _)");
  if(pw.length<6)return say("รหัสผ่านอย่างน้อย 6 ตัว");
  try{
    const r=db.doc("accounts/"+u),s=await r.get();
    if(authMode=="up"){
      if(s.exists)return say("ชื่อนี้ถูกใช้แล้ว");
      const salt=Math.random().toString(36).slice(2,10),hash=await H(salt+pw);
      await r.set({salt,hash,role:"user"});me={u,role:"user"};LS.set("sess",JSON.stringify({u,hash}));
    }else{
      if(!s.exists)return say("ไม่พบบัญชีนี้");
      const d=s.data(),hash=await H(d.salt+pw);
      if(hash!=d.hash)return say("รหัสผ่านไม่ถูกต้อง");
      me={u,role:d.role};LS.set("sess",JSON.stringify({u,hash}));
    }
    track(u);note="";tab="shop";showAuth=false;await load();liveWallet();render();if(pend){const i=pend;pend=null;detail(i)}say((authMode=="up"?"สมัครสมาชิกสำเร็จ ยินดีต้อนรับ ":"ยินดีต้อนรับ ")+u,1);
  }catch(e){say(ERR(e))}
}
function logout(){LS.set("sess","");if(unW){try{unW()}catch(e){}unW=null}me=null;credits=0;orders=[];tab="shop";showAuth=false;note="";render();say("ออกจากระบบแล้ว",1)}
async function redeem(){
  const code=$("#k").value.trim().toUpperCase();if(!code)return say("กรุณากรอกคีย์");
  if(!/^[A-Z0-9_-]+$/.test(code))return say("รูปแบบคีย์ไม่ถูกต้อง");
  try{
    const r=db.doc("keys/"+code),s=await r.get();
    if(!s.exists)return say("ไม่พบคีย์นี้");
    if(s.data().used)return say("คีย์นี้ถูกใช้ไปแล้ว");
    await r.update({used:true,by:me.u,usedAt:Date.now()});
    const w=await wref().get(),cur=w.exists?(w.data().credits||0):credits;
    const n=cur+s.data().credits;await wref().set({credits:n});credits=n;
    note="";render();say("เติมเครดิต +"+s.data().credits+" สำเร็จ",1);
  }catch(e){say(ERR(e))}
}
async function buy(id){
  const p=products.find(x=>x.id==id);if(!p)return;
  if(!me){pend=id;closeM();goAuth("in");return}

/* ฐานข้อมูลสำรอง (ใช้เมื่อยังไม่ได้ใส่ firebaseConfig) เก็บในเครื่องเท่านั้น */
function mkDb(){
  const K="shopdb";let M={};
  const rd=()=>{try{const v=localStorage.getItem(K);if(v)return JSON.parse(v)}catch(e){}return M},wr=o=>{M=o;try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}};
  const o=rd();
  if(!o["accounts/admin"])o["accounts/admin"]=ADMIN;
  if(!o["settings/site"])o["settings/site"]={name:"ร้านเครดิต",ig:"",line:"",logo:""};
  wr(o);
  const snap=(p,d)=>({id:p.split("/").pop(),exists:!!d,data:()=>d});
  const Q=(c,f=[],ord=null,lim=0)=>({
    where:(a,op,v)=>Q(c,[...f,[a,op,v]],ord,lim),orderBy:(a,d="asc")=>Q(c,f,[a,d],lim),limit:n=>Q(c,f,ord,n),
    get:async()=>{const o=rd(),n=c.split("/").length+1;let l=Object.keys(o).filter(k=>k.startsWith(c+"/")&&k.split("/").length==n).map(k=>snap(k,o[k]));
      f.forEach(([a,op,v])=>{l=l.filter(d=>{const x=d.data()[a];return op=="=="?x===v:op=="!="?x!==v:true})});
      if(ord)l.sort((p,q)=>{const a=p.data()[ord[0]],b=q.data()[ord[0]];return(a>b?1:a<b?-1:0)*(ord[1]=="desc"?-1:1)});
      if(lim)l=l.slice(0,lim);return{docs:l}},
    add:async x=>{const id=Math.random().toString(36).slice(2,10),o=rd();o[c+"/"+id]=x;wr(o);return{id}}});
  return{
    doc:p=>({
      get:async()=>snap(p,rd()[p]),
      set:async x=>{const o=rd();o[p]=x;wr(o)},
      update:async x=>{const o=rd();o[p]={...(o[p]||{}),...x};wr(o)},
      delete:async()=>{const o=rd();delete o[p];wr(o)}}),
    collection:c=>Q(c)
  }
}
