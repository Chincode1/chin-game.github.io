async function doLogin(){
let u=$("#lg_id").value.trim();const pw=$("#lg_pw").value;
if(!u)return say("กรอกอีเมลหรือชื่อผู้ใช้");
if(!pw)return say("กรอกรหัสผ่าน");
try{
if(u.includes("@")){
const q=await db.collection("accounts").where("email","==",u.toLowerCase()).get();
if(!q.docs.length)return say("ไม่พบอีเมลนี้");
u=q.docs[0].id;
}
if(!/^[A-Za-z0-9_.-]+$/.test(u))return say("ชื่อผู้ใช้ไม่ถูกต้อง");
let role="user";
if(u==="admin"){
if(!await verifyPw("admin",pw))return say("รหัสผ่านไม่ถูกต้อง");
role="admin";
}else{
const s=await db.doc("accounts/"+u).get();
if(!s.exists)return say("ไม่พบชื่อผู้ใช้นี้");
const d=s.data();
if(!d.hash)return say("บัญชีนี้เข้าสู่ระบบด้วย Google / LINE");
if(d.hash!==await sha(pw,d.salt||"chin"))return say("รหัสผ่านไม่ถูกต้อง");
if(d.banned)return say("บัญชีนี้ถูกระงับ");
role=d.role||"user";
}
await finishLogin(u,role,"in");
}catch(e){say(ERR(e))}
}
async function doSignup(){
const em=$("#su_em").value.trim().toLowerCase(),u=$("#su_u").value.trim(),ph=$("#su_ph").value.trim().replace(/[\s-]/g,""),pw=$("#su_pw").value;
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return say("อีเมลไม่ถูกต้อง");
if(!/^[A-Za-z0-9_.-]{4,30}$/.test(u))return say("ชื่อผู้ใช้ 4-30 ตัว (A-Z a-z 0-9 _ . -)");
if(u.toLowerCase()==="admin")return say("ชื่อผู้ใช้นี้ถูกใช้งานแล้ว");
if(!/^0\d{8,9}$/.test(ph))return say("เบอร์โทรศัพท์ไม่ถูกต้อง");
if(pw.length<6)return say("รหัสผ่านอย่างน้อย 6 ตัวอักษร");
try{
const r=db.doc("accounts/"+u);
if((await r.get()).exists)return say("ชื่อผู้ใช้นี้ถูกใช้งานแล้ว");
const q=await db.collection("accounts").where("email","==",em).get();
if(q.docs.length)return say("อีเมลนี้ถูกใช้งานแล้ว");
const salt=Math.random().toString(36).substring(2,10);
await r.set({hash:await sha(pw,salt),salt,role:"user",email:em,phone:ph,loginCount:0,lastLogin:Date.now()});
await db.doc("wallets/"+u).set({credits:+site.welcome||0,orders:[]});
await finishLogin(u,"user","up");
}catch(e){say(ERR(e))}
}

const HX=/^#[0-9a-f]{6}$/i;
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const vars=(bg,tx,ac)=>{let o="";if(HX.test(bg))o+=`--bg:${bg};`;if(HX.test(tx)&&HX.test(bg))o+=`--tx:${tx};--mu:color-mix(in srgb,${tx} 50%,${bg});--bd:color-mix(in srgb,${tx} 12%,${bg});`;if(HX.test(ac))o+=`--ac:${ac};--ac2:${lum(ac)>.45?"#111":"#fff"};`;return o};
function applyTheme(t){
let el=$("#thm");
if(!el){el=document.createElement("style");el.id="thm";document.head.appendChild(el)}
const css=[],L=vars(t.bgL,t.txL,t.acL),D=vars(t.bgD,t.txD,t.acD);
if(L)css.push(`:root{${L}}`);
if(D)css.push(`@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){${D}}}:root[data-theme="dark"]{${D}}`);
if(t.fsize)css.push(`body{font-size:${+t.fsize}px}`);
if(t.radius!=null)css.push(`.c,.md{border-radius:${+t.radius+4}px}.p .im{border-radius:${+t.radius+2}px}.b,select{border-radius:${+t.radius}px}`);
if(t.tile)css.push(`.g{grid-template-columns:repeat(auto-fill,minmax(${+t.tile}px,1fr))}`);
if(t.ratio&&/^\d+\/\d+$/.test(t.ratio))css.push(`.p .im{aspect-ratio:${t.ratio}}`);
if(t.font&&/^[A-Za-z ]+$/.test(t.font)){
css.push(`body{font-family:"${t.font}",system-ui,sans-serif}`);
let l=$("#fl");if(!l){l=document.createElement("link");l.id="fl";l.rel="stylesheet";document.head.appendChild(l)}
l.href=`https://fonts.googleapis.com/css2?family=${t.font.replace(/ /g,"+")}:wght@300;400;500&display=swap`;
}
el.textContent=css.join("\n");try{applyMedia(t)}catch(e){}
}
function splash(t){

const z=$("#sp0");if(z)z.remove();
if(t.spOn===false)return;
const d=(+t.dur||2)*1000,e=document.createElement("div");
e.id="sp1";e.className="sp "+(["zoom","slide","fade"].includes(t.sty)?t.sty:"zoom");
if(t.spC&&HX.test(t.sbg)&&HX.test(t.stx))e.style.cssText=`background:${t.sbg};color:${t.stx}`;
e.innerHTML=`<div class="si">${t.logo?`<img src="${esc(t.logo)}">`:`<div class="nm">${esc(t.name||DEF_NAME)}</div>`}<div class="tg">${esc(t.tag||"")}</div><div class="sb"><u style="animation-duration:${d}ms"></u></div></div>`;
document.body.appendChild(e);
setTimeout(()=>{e.classList.add("hide");setTimeout(()=>e.remove(),700)},d);
}

async function sendAngpao(){
const raw=($("#ao")?.value||"").trim(),a=+($("#aa")?.value||0);
const m=raw.match(/[?&]v=([0-9A-Za-z]{10,})/)||raw.match(/^([0-9A-Za-z]{18,})$/);
if(!m)return say("ลิงก์ซองอั่งเปาไม่ถูกต้อง");
const code=m[1],auto=site.aoMode=="auto"&&site.aoApi;
if(!auto&&!(a>0))return say("กรอกจำนวนเงินในซอง");
if(!auto&&a<(site.min||0))return say("ขั้นต่ำ "+site.min+" บาท");
if(busy)return;busy=true;
const b=$("#aob");if(b)b.disabled=true;
try{
const cr=db.doc("angpao/"+code);
if((await cr.get()).exists)throw new Error("ซองนี้ถูกส่งเข้าระบบแล้ว");
const id=Math.random().toString(36).substring(2,10),at=Date.now(),link="https://gift.truemoney.com/campaign/?v="+code;
if(auto){
const res=await fetch(site.aoApi,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:site.aoPhone||"",link,code})});
const d=await res.json().catch(()=>({}));
const amt=+(d.amount??d.data?.my_ticket?.amount_baht??d.data?.voucher?.amount_baht??0);
if(!(amt>0))throw new Error(d.message||"แลกซองไม่สำเร็จ");
const cdt=tcr(amt);
await cr.set({u:me.u,at,amount:amt});
await db.doc("topups/"+id).set({id,u:me.u,amount:amt,credits:cdt,type:"angpao",link,code,at,status:"approved"});
await addCredits(me.u,cdt);
await load();render();say("เติมเงินสำเร็จ +"+cdt+" เครดิต",1);
}else{
await cr.set({u:me.u,at,amount:a});
await db.doc("topups/"+id).set({id,u:me.u,amount:a,credits:tcr(a),type:"angpao",link,code,at,status:"pending"});
await load();render();say("ส่งซองแล้ว รอแอดมินตรวจสอบ",1);
}
}catch(e){if(b)b.disabled=false;say(ERR(e))}
finally{busy=false}
}
async function redeem(){

await cr.update({used:[...used,me.u]});await addCredits(me.u,d.credits);

}}

}catch(e){say(ERR(e))}
finally{busy=false}
}

async function decide(id,ok){
if(busy)return;busy=true;
try{
const r=db.doc("topups/"+id),s=await r.get();
if(!s.exists)return say("ไม่พบรายการ");
const t=s.data();
if(t.status!=="pending")return say("รายการนี้ถูกดำเนินการไปแล้ว");
await r.update({status:ok?"approved":"rejected"});
if(ok)await addCredits(t.u,t.credits);
else if(t.type=="angpao"&&t.code){try{await db.doc("angpao/"+t.code).delete()}catch(e){}}
await load();render();say(ok?"อนุมัติสำเร็จ":"ปฏิเสธสำเร็จ",ok);
}catch(e){say(ERR(e))}

/* ===== จบส่วนเพิ่มเติม ===== */
function mkDb(){
const K="shopdb";let M={};
const rd=()=>{try{const v=localStorage.getItem(K);if(v)return JSON.parse(v)}catch(e){}return M};
const wr=o=>{M=o;try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}};
const o=rd();if(!o["accounts/admin"])o["accounts/admin"]=ADMIN;if(!o["settings/site"])o["settings/site"]={name:DEF_NAME,rate:1,min:0};wr(o);
const snap=(p,d)=>({id:p.split("/").pop(),exists:!!d,data:()=>d});
const Q=(c,f=[],ord=null,lim=0)=>({
where:(a,op,v)=>Q(c,[...f,[a,op,v]],ord,lim),
orderBy:(a,d="asc")=>Q(c,f,[a,d],lim),
limit:n=>Q(c,f,ord,n),
get:async()=>{
const o=rd(),n=c.split("/").length+1;
let l=Object.keys(o).filter(k=>k.startsWith(c+"/")&&k.split("/").length===n).map(k=>snap(k,o[k]));
f.forEach(([a,op,v])=>{l=l.filter(d=>d.data()[a]===v)});
if(ord)l.sort((p,q)=>{const a=p.data()[ord[0]],b=q.data()[ord[0]];return(a>b?1:a<b?-1:0)*(ord[1]=="desc"?-1:1)});
if(lim)l=l.slice(0,lim);
return{docs:l};
},
add:async x=>{const id=Math.random().toString(36).slice(2,10),o=rd();o[c+"/"+id]=x;wr(o);return{id}}
});
return{
doc:p=>({
get:async()=>snap(p,rd()[p]),
set:async x=>{const o=rd();o[p]=x;wr(o)},
update:async x=>{const o=rd();o[p]={...(o[p]||{}),...x};wr(o)},
delete:async()=>{const o=rd();delete o[p];wr(o)}
}),
collection:c=>Q(c)
};
}

window.catPick=()=>{
const id=$("#cas").value,e=$("#cap");if(!e)return;
e.innerHTML=products.map(p=>`<label class="cl">${esc(p.name)}<input type="checkbox" class="cpk" value="${p.id}" style="width:20px;height:20px;margin:0" ${p.cat==id?"checked":""}></label>`).join("")||'<span class="mu">ไม่มีสินค้า</span>';
};
window.catSave=async()=>{
const id=$("#cas").value;if(!id)return;
try{for(const c of document.querySelectorAll(".cpk")){const p=products.find(x=>x.id==c.value);
if(c.checked&&p.cat!=id)await db.doc("products/"+p.id).update({cat:id});
else if(!c.checked&&p.cat==id)await db.doc("products/"+p.id).update({cat:""})}
await load();render();say("บันทึกแล้ว",1)}catch(e){say(ERR(e))}
};
/* ===== reveal animation ===== */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
const reveal=()=>document.querySelectorAll("#app .p,#app .c,#app .ct,#app .st div").forEach((e,i)=>{if(e.classList.contains("rv0"))return;e.classList.add("rv0");e.style.transitionDelay=Math.min(i%6,5)*50+"ms";io.observe(e)});
const _g=grid;grid=function(){_g();reveal()};
/* ===== หลัง render ===== */
function post(){
const app=$("#app");if(!app)return;
document.body.classList.toggle("catbig",site.catStyle=="big");
app.classList.toggle("ctr",tab=="me");
const hd=app.querySelector("header");
if(me&&me.role=="admin"&&accts.length){
const st={u:accts.length,o:allOrders().length,s:allTop.filter(t=>t.status=="approved").reduce((x,t)=>x+t.amount,0)};
if(!site.stats||site.stats.u!=st.u||site.stats.o!=st.o||site.stats.s!=st.s){site.stats=st;db.doc("settings/site").set({...site,stats:st}).catch(()=>{})}
}
if(tab=="shop"&&hd){
let h="";
if(me&&me.role=="admin"){const n=allTop.filter(t=>t.status=="pending").length;
h+=`<div class="c r" style="cursor:pointer" onclick="adminGate()"><div><h3>💰 รายการเติมเงิน / สลิป</h3><div class="mu">ต้องใส่รหัสแอดมินก่อนเข้า</div></div><span class="chip ${n?"rejected":""}">${n} รอตรวจ</span></div>`}
if(site.showStat&&site.stats)h+=`<div class="st"><div><b>${site.stats.u}</b><span>ลูกค้าทั้งหมด</span></div><div><b>${site.stats.o}</b><span>การซื้อ</span></div><div><b>${site.stats.s}</b><span>ยอดขาย (บาท)</span></div></div>`;
hd.insertAdjacentHTML("afterend",h);
if(site.lineUrl||site.email)app.insertAdjacentHTML("beforeend",`<div class="mu" style="text-align:center;margin-top:26px">ติดต่อสอบถาม</div><div class="ctl">${site.lineUrl?`<a href="${esc(site.lineUrl)}" target="_blank" rel="noopener" style="background:#06C755" aria-label="LINE">${SVG_LINE}</a>`:""}${site.email?`<a href="mailto:${esc(site.email)}" style="background:#ea4335;color:#fff" aria-label="อีเมล">${SVG_MAIL.replace(/22/g,"28")}</a>`:""}</div>`);
}
if(tab=="admin"&&asub=="cats"){
app.insertAdjacentHTML("beforeend",`<div class="c"><h3>รูปแบบหมวดหมู่</h3><select id="cst" style="max-width:100%"><option value="circle">วงกลมเล็ก</option><option value="big"${site.catStyle=="big"?" selected":""}>การ์ดใหญ่</option></select><div style="margin-top:10px"><button class="b sm" onclick="sv({catStyle:$('#cst').value})">บันทึก</button></div></div><div class="c"><h3>ใส่สินค้าเข้าหมวด</h3><select id="cas" style="max-width:100%" onchange="catPick()">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select><div id="cap" style="margin-top:8px"></div><button class="b sm" style="margin-top:10px" onclick="catSave()">บันทึกสินค้าในหมวด</button></div>`);catPick();
}
if(tab=="admin"&&asub=="settings")app.insertAdjacentHTML("beforeend",`<div class="c"><h3>ติดต่อ / สถิติ / ยืนยันมนุษย์</h3><label class="mu">ลิงก์ LINE</label><input id="ln1" value="${esc(site.lineUrl||"")}" placeholder="https://line.me/ti/p/..."><label class="mu">อีเมลร้าน</label><input id="em1" value="${esc(site.email||"")}"><label class="cl">โชว์สถิติหน้าแรก<input type="checkbox" id="ss1" style="width:20px;height:20px;margin:0" ${site.showStat?"checked":""}></label><label class="mu">Turnstile Site Key (ไม่ใส่ = ใช้โจทย์เลข)</label><input id="ts1" value="${esc(site.tsKey||"")}"><button class="b" style="margin-top:10px" onclick="sv({lineUrl:$('#ln1').value.trim(),email:$('#em1').value.trim(),showStat:$('#ss1').checked,tsKey:$('#ts1').value.trim()})">บันทึก</button></div>`);
reveal();
}
const _r=render;render=function(){_r();try{post()}catch(e){console.error(e)}};
try{render()}catch(e){}
})();
</script>


  
</body></html>
